services:
  boosty-downloader:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: boosty-downloader:local
    restart: unless-stopped
    user: "${BD_UID:?BD_UID is required}:${BD_GID:?BD_GID is required}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BD_PUBLISH_IP:-0.0.0.0}:${BD_PORT:-8443}:8443"
    environment:
      BD_LISTEN: ":8443"
      BD_DATA_DIR: /var/lib/boosty-downloader
      BD_TLS_CERT: /etc/boosty-downloader/tls/fullchain.pem
      BD_TLS_KEY: /etc/boosty-downloader/tls/privkey.pem
    env_file:
      - /etc/boosty-downloader/environment
    volumes:
      - /etc/boosty-downloader/tls:/etc/boosty-downloader/tls:ro
      - /var/lib/boosty-downloader:/var/lib/boosty-downloader:rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
