# Optional NVIDIA overlay. Requires host driver and NVIDIA Container Toolkit.
# Run: docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.gpu-nvidia.yaml up -d --build
services:
  boosty-downloader:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: video,utility,compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
