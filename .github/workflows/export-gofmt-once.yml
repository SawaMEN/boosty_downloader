name: SQL primary app lifecycle verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify app lifecycle
        shell: bash
        run: |
          gofmt -w internal/server/server.go internal/server/sqlite_primary_app_test.go
          go test ./internal/server -run '^(TestSQLPrimaryApp|TestSQLPrimaryStartup|TestSQLFirst|TestSQLiteActiveBackend|TestPinJSON|TestSQLVideo|TestSQLPurge|TestSQLBlobGC)' -count=1 -v -timeout=120s
          for path in internal/server/server.go internal/server/sqlite_primary_app_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
