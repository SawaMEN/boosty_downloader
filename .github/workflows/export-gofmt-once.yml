name: Full recovery point verification
on:
  push:
    branches: [tooling/gofmt-video-journal-20261123]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and test cutover recovery
        shell: bash
        run: |
          gofmt -w internal/server/sqlite_cutover_journal.go internal/server/sqlite_cutover_preflight.go internal/server/sqlite_backend_selection.go cmd/boosty-dbcheck/main.go internal/server/sqlite_cutover_full_snapshot.go internal/server/sqlite_cutover_full_snapshot_test.go
          go test ./internal/server -run '^TestSQLiteCutover' -count=1 -v
          go test ./cmd/boosty-dbcheck
          for path in internal/server/sqlite_cutover_journal.go internal/server/sqlite_cutover_preflight.go internal/server/sqlite_backend_selection.go cmd/boosty-dbcheck/main.go internal/server/sqlite_cutover_full_snapshot.go internal/server/sqlite_cutover_full_snapshot_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
