name: SQL video publication verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify SQL video
        shell: bash
        run: |
          gofmt -w internal/server/video_publication.go internal/server/video_publication_journal.go internal/server/sqlite_video_publication.go internal/server/sqlite_video_publication_test.go
          go test ./internal/server -run '^(TestSQLVideo|TestVideoPublication|TestVideoRendition|TestSQLPurge|TestSQLRevisionRestore|TestSQLHistory)' -count=1 -v -timeout=120s
          for path in internal/server/video_publication.go internal/server/video_publication_journal.go internal/server/sqlite_video_publication.go internal/server/sqlite_video_publication_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
