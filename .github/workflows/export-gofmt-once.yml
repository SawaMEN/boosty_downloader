name: SQL revision restore verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify SQL restore
        shell: bash
        run: |
          gofmt -w internal/server/revisions.go internal/server/sqlite_history_delete.go internal/server/sqlite_archive_publication.go internal/server/sqlite_revision_restore_test.go
          go test ./internal/server -run '^(TestSQLRevisionRestore|TestSQLHistory|TestSQLArchivePublication|TestArchiveRevision|TestRevision|TestRestore)' -count=1 -v -timeout=120s
          for path in internal/server/revisions.go internal/server/sqlite_history_delete.go internal/server/sqlite_archive_publication.go internal/server/sqlite_revision_restore_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
