name: SQL primary startup verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify SQL startup
        shell: bash
        run: |
          gofmt -w internal/server/storage.go internal/server/sqlite_backend_selection.go internal/server/sqlite_primary_startup.go internal/server/sqlite_primary_startup_test.go
          go test ./internal/server -run '^(TestSQLPrimaryStartup|TestSQLFirst|TestSQLiteActiveBackend|TestPinJSON|TestSQLBlobGC|TestSQLPurge|TestSQLRevisionRestore|TestSQLVideo)' -count=1 -v -timeout=120s
          for path in internal/server/storage.go internal/server/sqlite_backend_selection.go internal/server/sqlite_primary_startup.go internal/server/sqlite_primary_startup_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
