name: SQL permanent purge verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify SQL purge
        shell: bash
        run: |
          gofmt -w internal/server/library_management.go internal/server/trash_purge_journal.go internal/server/sqlite_purge.go internal/server/sqlite_purge_test.go
          go test ./internal/server -run '^(TestSQLPurge|TestPurgeJournal|TestTrash|TestSQLRevisionRestore|TestSQLHistory|TestSQLFirstStorage)' -count=1 -v -timeout=120s
          for path in internal/server/library_management.go internal/server/trash_purge_journal.go internal/server/sqlite_purge.go internal/server/sqlite_purge_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
