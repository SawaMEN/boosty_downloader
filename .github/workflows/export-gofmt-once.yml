name: SQL rollback retirement and roundtrip verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify rollback roundtrip
        shell: bash
        run: |
          gofmt -w internal/server/sqlite_backend_rollback.go internal/server/sqlite_backend_rollback_test.go internal/server/sqlite_snapshot_audit.go internal/server/sqlite_backup_verify.go cmd/boosty-dbcheck/main.go internal/server/sqlite_rollback_tree.go
          go test ./internal/server -run '^(TestSQLiteRollback|TestSQLPrimaryActivation|TestSQLPrimaryApp|TestSQLPrimaryStartup|TestPinJSON|TestSQLiteCutover|TestFullData|TestSQLiteBackup)' -count=1 -v -timeout=120s
          go test ./cmd/boosty-dbcheck
          for path in internal/server/sqlite_backend_rollback.go internal/server/sqlite_backend_rollback_test.go internal/server/sqlite_snapshot_audit.go internal/server/sqlite_backup_verify.go cmd/boosty-dbcheck/main.go internal/server/sqlite_rollback_tree.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
