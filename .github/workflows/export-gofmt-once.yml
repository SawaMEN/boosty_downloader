name: SQL primary large library verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and test streaming guard
        shell: bash
        run: |
          gofmt -w internal/server/sqlite_shadow.go internal/server/sqlite_primary_read_adapter.go internal/server/sqlite_primary_scale_test.go
          go test ./internal/server -run '^(TestSQLPrimary|TestSQLFirst|TestSQLiteMetadata|TestSQLiteShadow|TestSQLVideo|TestSQLPurge|TestSQLBlobGC|TestSQLiteRollback|TestSQLHistory|TestSQLRevisionRestore)' -count=1 -v -timeout=180s
          go test ./internal/server -run '^$' -bench '^BenchmarkSQLPrimaryLibraryGuard$' -benchmem -benchtime=1x -count=1 -timeout=180s
          for path in internal/server/sqlite_shadow.go internal/server/sqlite_primary_read_adapter.go internal/server/sqlite_primary_scale_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
