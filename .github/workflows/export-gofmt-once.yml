name: SQLite offline rollback verification
on:
  push:
    branches: [tooling/gofmt-video-journal-20261123]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and verify offline rollback
        shell: bash
        run: |
          gofmt -w internal/server/sqlite_revision_reindex.go internal/server/sqlite_backup.go internal/server/sqlite_backend_selection.go internal/server/server.go internal/server/storage.go cmd/boosty-dbcheck/main.go internal/server/sqlite_backend_rollback.go internal/server/sqlite_backend_rollback_test.go
          go test ./internal/server -run '^(TestSQLiteRollback|TestSQLiteCutover|TestJSONBackend|TestSQLiteBackend|TestPinJSON)' -count=1 -v
          go test ./cmd/boosty-dbcheck
          for path in internal/server/sqlite_revision_reindex.go internal/server/sqlite_backup.go internal/server/sqlite_backend_selection.go internal/server/server.go internal/server/storage.go cmd/boosty-dbcheck/main.go internal/server/sqlite_backend_rollback.go internal/server/sqlite_backend_rollback_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
