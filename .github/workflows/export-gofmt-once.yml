name: SQL primary offline activation verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify offline activation
        shell: bash
        run: |
          gofmt -w internal/server/sqlite_revision_reindex.go internal/server/sqlite_shadow_restore.go internal/server/sqlite_primary_activation.go internal/server/sqlite_primary_activation_test.go
          go test ./internal/server -run '^(TestSQLPrimaryActivation|TestSQLPrimaryApp|TestSQLPrimaryStartup|TestSQLiteCutover|TestSQLiteRollback|TestPinJSON|TestSQLiteReindex|TestRestoreSQLiteShadow)' -count=1 -v -timeout=120s
          for path in internal/server/sqlite_revision_reindex.go internal/server/sqlite_shadow_restore.go internal/server/sqlite_primary_activation.go internal/server/sqlite_primary_activation_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
