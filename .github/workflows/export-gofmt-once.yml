name: SQL metadata hot path verification
on:
  push:
    branches: [tooling/sqlite-history-journal-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, test and benchmark SQL metadata
        shell: bash
        run: |
          gofmt -w internal/server/sqlite_metadata.go internal/server/sqlite_shadow.go internal/server/sqlite_preflight.go internal/server/sqlite_metadata_perf_test.go
          go test ./internal/server -run '^(TestSQLiteMetadata|TestSQLPrimary|TestSQLFirst|TestSQLiteShadow|TestSQLVideo|TestSQLPurge|TestSQLBlobGC|TestSQLiteRollback)' -count=1 -v -timeout=120s
          go test ./internal/server -run '^$' -bench '^BenchmarkSQLiteMetadataEqual$' -benchmem -benchtime=300ms -count=3
          for path in internal/server/sqlite_metadata.go internal/server/sqlite_shadow.go internal/server/sqlite_preflight.go internal/server/sqlite_metadata_perf_test.go; do
            printf 'FORMATTED_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_END:%s\n' "$path"
          done
