name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Check shell syntax
        run: bash -n install.sh deploy/boosty-downloader-manager deploy/boosty-downloader-cert-renew
      - name: Vet
        run: go vet ./...
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Docker image build
        run: docker build -f deploy/docker/Dockerfile -t boosty-downloader:test .
  binaries:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags='-s -w' -o dist/boosty-downloader-linux-${{ matrix.arch }} ./cmd/boosty-downloader
      - run: cd dist && sha256sum boosty-downloader-linux-${{ matrix.arch }} > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: boosty-downloader-linux-${{ matrix.arch }}
          path: dist/*
