name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-sqlite-hardening-v2
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned Go dependencies
        run: go mod download
      - name: Verify offline SQLite export and safety
        run: python3 -m unittest discover -s tests -p 'test_sqlite_migrate.py' -v
      - name: Check interface scripts
        run: node --check internal/server/ui/app.js && node --check internal/server/ui/library.js && node --check internal/server/ui/subscriptions.js && node --check internal/server/ui/admin.js && python3 tests/ui_contract.py
      - name: Check formatting
        run: |
          changed="$(gofmt -l ./cmd ./internal)"
          if [ -n "$changed" ]; then
            printf "Files requiring gofmt:\n%s\n" "$changed"
            while IFS= read -r file; do
              [ -z "$file" ] || gofmt -d "$file"
            done <<< "$changed"
            exit 1
          fi
      - name: Check shell syntax and installer help
        run: |
          bash -n install.sh deploy/boosty-downloader-manager deploy/boosty-downloader-cert-renew deploy/boosty-video-deps deploy/boosty-auto-update tests/rollback_smoke.sh
          bash install.sh --help >/dev/null
          if bash install.sh --mode invalid >/dev/null 2>&1; then
            echo "invalid installation mode was accepted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Install Zstd for storage tests
        run: command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
      - name: Install FFmpeg for offline HLS remux test (bounded)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 90s sudo apt-get update -qq && timeout 90s sudo apt-get install -y -qq ffmpeg || echo "FFmpeg unavailable: optional offline remux tests may skip"
          fi
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Docker image build
        run: docker build -f deploy/docker/Dockerfile -t boosty-downloader:test .
  binaries:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags='-s -w' -o dist/boosty-downloader-linux-${{ matrix.arch }} ./cmd/boosty-downloader
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags='-s -w' -o dist/boosty-dbcheck-linux-${{ matrix.arch }} ./cmd/boosty-dbcheck
      - run: cd dist && sha256sum boosty-downloader-linux-${{ matrix.arch }} boosty-dbcheck-linux-${{ matrix.arch }} > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: boosty-downloader-linux-${{ matrix.arch }}
          path: dist/*
  installation-smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [native, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ${{ matrix.mode }} on a clean CI host
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          # Exercise the same root-privileged, standalone stdin bootstrap as
          # curl -fsSL .../install.sh | sudo bash, not just a checked-out repo.
          mkdir -p "$RUNNER_TEMP/standalone-install"
          (
            cd "$RUNNER_TEMP/standalone-install"
            sudo env PATH="$PATH" BD_PUBLIC_HOST=127.0.0.1 BD_PORT=18443 \
              BD_TLS_MODE=selfsigned BD_BUILD_FROM_SOURCE=1 \
              BD_ADMIN_USER=admin BD_ADMIN_PASSWORD='test-admin-password-123' \
              bash -s -- --mode "$MODE" < "$GITHUB_WORKSPACE/install.sh"
          )
          for attempt in $(seq 1 30); do
            if curl -kfsS https://127.0.0.1:18443/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -kfsS https://127.0.0.1:18443/healthz
          status="$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/api/jobs)"
          test "$status" = 401
          curl -kfsS -c "$RUNNER_TEMP/boosty-cookies.txt" \
            -H 'X-BD-Request: 1' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"test-admin-password-123"}' \
            https://127.0.0.1:18443/api/account/login
          curl -kfsS -b "$RUNNER_TEMP/boosty-cookies.txt" https://127.0.0.1:18443/api/jobs
          sudo bdy status
          if [ "$MODE" = native ]; then
            command -v boosty-dbcheck
            boosty-dbcheck --help >/dev/null 2>&1
          fi
          # Break the running binary/container, recover with root-owned rollback,
          # and verify that user bytes, service secrets and TLS did not change.
          sudo env GITHUB_ACTIONS=true BD_ROLLBACK_SMOKE=yes \
            bash "$GITHUB_WORKSPACE/tests/rollback_smoke.sh" "$MODE"
          sudo bdy uninstall
